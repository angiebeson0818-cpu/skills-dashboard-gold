const STORAGE_KEY = "claude-cowork-custom-skills";
const state = { search: "", active: "All", modalOpen: false, formError: false, copied: null };

// Auto "last updated" — reads the file's own Last-Modified (set to deploy time by Netlify).
// Updates itself on every redeploy; never needs a manual bump.
const LAST_UPDATED = (() => {
  let d = new Date(document.lastModified);
  if (isNaN(d) || d.getFullYear() < 2020) d = new Date();
  const mon = d.toLocaleString("en-US", { month: "short" }).toUpperCase();
  return { full: mon + " " + d.getDate() + ", " + d.getFullYear(), short: mon + " " + d.getDate() };
})();

function loadItems() {
  const base = SEED.slice();
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    if (Array.isArray(saved)) return base.concat(saved.map(s => ({ project: SHORT, ...s })));
  } catch (e) {}
  return base;
}
let ITEMS = loadItems();

const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

  const q = state.search.trim().toLowerCase();
  const match = (it) => {
    if (state.active !== "All" && it.category !== state.active) return false;
    if (!q) return true;
    return (it.title + " " + it.command + " " + it.desc + " " + it.project).toLowerCase().includes(q);

        ? `<span style="position:absolute;top:12px;right:12px;display:inline-flex;align-items:center;gap:5px;background:#9ccc4f;color:#1c1713;font-size:10.5px;font-weight:700;letter-spacing:.6px;padding:4px 10px;border-radius:999px;animation:scd-fade .15s ease both;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>COPIED</span>`
        : "";

        ${copiedTag}
        <div style="display:flex;gap:12px;align-items:flex-start;">
          <svg width="22" height="22" viewBox="0 0 24 24" style="color:#d4af37;flex-shrink:0;margin-top:2px;">${STAR}</svg>
          <div style="min-width:0;">
            <div style="font-weight:700;font-size:15.5px;color:#23211e;line-height:1.25;">${esc(it.title)}</div>
            <div style="display:flex;align-items:center;gap:6px;margin-top:3px;">
              <span style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:#b8912e;word-break:break-all;">${esc(it.command)}</span>

  const noResults = filtered.length === 0;

          <button class="scd-btn-gold" onclick="submitSkill()" style="background:linear-gradient(180deg,#e8c766,#b8912e);border:1px solid #9a7b26;color:#1c1409;border-radius:11px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 6px 18px -6px rgba(184,145,46,.6);">Add Skill</button>

  document.getElementById("app").innerHTML = `

    <div style="position:fixed;inset:0;z-index:0;pointer-events:none;display:flex;align-items:center;justify-content:center;">
      <img src="angwithonyx.jpeg" alt="" style="height:94vh;width:auto;opacity:.11;filter:sepia(1) saturate(1.5) hue-rotate(-8deg) brightness(.9);-webkit-mask-image:radial-gradient(ellipse 62% 58% at 50% 46%, #000 38%, transparent 76%);mask-image:radial-gradient(ellipse 62% 58% at 50% 46%, #000 38%, transparent 76%);">
    </div>
    <div style="position:fixed;inset:0;z-index:0;pointer-events:none;background:url('6.png') center 46%/135% auto no-repeat;mix-blend-mode:screen;opacity:.4;"></div>
    <div style="position:absolute;top:26px;right:34px;z-index:5;">
      <button class="scd-add" onclick="openModal()" style="display:inline-flex;align-items:center;gap:9px;background:linear-gradient(180deg,#e8c766,#b8912e);color:#1c1409;border:1px solid #9a7b26;border-radius:11px;padding:11px 18px 11px 15px;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 6px 20px -6px rgba(184,145,46,.7), inset 0 1px 0 rgba(255,255,255,.25);letter-spacing:.2px;white-space:nowrap;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1c1409" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add New Skill
      </button>
    </div>
    <div style="max-width:1180px;margin:0 auto;padding:0 34px;position:relative;z-index:1;">
      <div style="text-align:center;padding:64px 0 0;">
        <div style="display:inline-flex;align-items:center;gap:10px;">
          <svg width="26" height="26" viewBox="0 0 24 24" style="color:#d4af37;"><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="12" y1="2.5" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="21.5" y2="12"/><line x1="5.2" y1="5.2" x2="18.8" y2="18.8"/><line x1="18.8" y1="5.2" x2="5.2" y2="18.8"/><line x1="12" y1="4" x2="12" y2="20" transform="rotate(22.5 12 12)"/><line x1="4" y1="12" x2="20" y2="12" transform="rotate(22.5 12 12)"/><line x1="12" y1="4" x2="12" y2="20" transform="rotate(67.5 12 12)"/><line x1="4" y1="12" x2="20" y2="12" transform="rotate(67.5 12 12)"/></g></svg>

            <span style="width:7px;height:7px;border-radius:50%;background:#d4af37;box-shadow:0 0 8px #d4af37;"></span>REFRESHED ${LAST_UPDATED.full}
          </span>
        </div>
        <h1 style="font-family:'Newsreader',serif;font-weight:500;font-size:66px;line-height:1.05;margin:14px 0 0;letter-spacing:-.5px;color:#f4eee7;">My <span style="font-style:italic;color:#d4af37;">Skills</span> Dashboard</h1>
        <p style="max-width:560px;margin:18px auto 0;font-size:16px;line-height:1.6;color:#b3aaa1;">Every skill and slash command installed on your Claude Cowork setup, in one place. Search, filter, or click any card to copy its trigger.</p>
        <div style="display:flex;justify-content:center;gap:54px;margin-top:40px;flex-wrap:wrap;">
          <div style="text-align:center;"><div style="font-family:'Newsreader',serif;font-size:38px;font-weight:600;color:#f0e9e1;line-height:1;">${total}</div><div style="font-size:11px;letter-spacing:1.6px;color:#8f8579;margin-top:8px;font-weight:600;">TOTAL</div></div>
          <div style="text-align:center;"><div style="font-family:'Newsreader',serif;font-size:38px;font-weight:600;color:#d4af37;line-height:1;">${skillsCount}</div><div style="font-size:11px;letter-spacing:1.6px;color:#8f8579;margin-top:8px;font-weight:600;">SKILLS</div></div>
          <div style="text-align:center;"><div style="font-family:'Newsreader',serif;font-size:38px;font-weight:600;color:#d4af37;line-height:1;">${commandsCount}</div><div style="font-size:11px;letter-spacing:1.6px;color:#8f8579;margin-top:8px;font-weight:600;">COMMANDS</div></div>
          <div style="text-align:center;"><div style="font-family:'Newsreader',serif;font-size:38px;font-weight:600;color:#f0e9e1;line-height:1;">${categoriesCount}</div><div style="font-size:11px;letter-spacing:1.6px;color:#8f8579;margin-top:8px;font-weight:600;">CATEGORIES</div></div>
        </div>
      </div>

      <div style="margin-top:54px;background:linear-gradient(180deg,#241d18,#1e1814);border:1px solid #34291f;border-radius:18px;padding:30px 34px;position:relative;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.03) inset;">
        <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#9ccc4f 30%,#d4af37 80%,transparent);"></div>
        <div style="display:flex;gap:34px;align-items:center;flex-wrap:wrap;">
          <div style="position:relative;width:118px;height:118px;flex-shrink:0;">
            <svg width="118" height="118" viewBox="0 0 118 118"><circle cx="59" cy="59" r="50" fill="none" stroke="#2e2620" stroke-width="9"/><circle cx="59" cy="59" r="50" fill="none" stroke="#9ccc4f" stroke-width="9" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="24" transform="rotate(-90 59 59)"/></svg>
            <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
              <span style="font-family:'Newsreader',serif;font-size:34px;font-weight:600;color:#f0e9e1;line-height:1;">${total}</span>
              <span style="font-size:9px;letter-spacing:1.8px;color:#9ccc4f;margin-top:3px;font-weight:700;">HEALTHY</span>
            </div>
          </div>
          <div style="flex:1;min-width:260px;">
            <div style="display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:1.4px;color:#9ccc4f;font-weight:700;font-family:ui-monospace,monospace;"><span style="width:6px;height:6px;border-radius:50%;background:#9ccc4f;"></span>SYSTEM AUDIT · ${LAST_UPDATED.short}</div>
            <div style="font-family:'Newsreader',serif;font-size:27px;font-weight:500;margin:8px 0 2px;color:#f2ece5;">Your system is <span style="font-style:italic;">stocked</span></div>
            <div style="font-size:14px;color:#9a9189;">${skillsCount} skills and ${commandsCount} commands installed and ready.</div>
            <div style="display:flex;gap:38px;margin-top:18px;flex-wrap:wrap;">
              <div><div style="font-family:'Newsreader',serif;font-size:24px;font-weight:600;color:#e9e2da;">4</div><div style="font-size:10px;letter-spacing:1.2px;color:#857c71;margin-top:3px;font-weight:600;">PLUGINS</div></div>
              <div><div style="font-family:'Newsreader',serif;font-size:24px;font-weight:600;color:#e9e2da;">14</div><div style="font-size:10px;letter-spacing:1.2px;color:#857c71;margin-top:3px;font-weight:600;">GLOBAL SKILLS</div></div>
              <div><div style="font-family:'Newsreader',serif;font-size:24px;font-weight:600;color:#e9e2da;">${categoriesCount}</div><div style="font-size:10px;letter-spacing:1.2px;color:#857c71;margin-top:3px;font-weight:600;">CATEGORIES</div></div>
              <div><div style="font-family:'Newsreader',serif;font-size:24px;font-weight:600;color:#e9e2da;">0</div><div style="font-size:10px;letter-spacing:1.2px;color:#857c71;margin-top:3px;font-weight:600;">BROKEN</div></div>
            </div>
          </div>
        </div>
        <div style="margin-top:22px;display:flex;flex-direction:column;gap:10px;">
          <div style="display:flex;align-items:center;gap:14px;background:#1a140f;border:1px solid #2e251d;border-radius:11px;padding:13px 16px;">
            <span style="font-size:10px;font-weight:700;letter-spacing:1px;color:#e0b84f;background:rgba(212,175,55,.14);border:1px solid rgba(212,175,55,.3);padding:4px 9px;border-radius:6px;flex-shrink:0;">NEW</span>
            <div><div style="font-weight:700;font-size:14px;color:#ece5dd;">Added your plugins + global skills</div><div style="font-size:13px;color:#94897f;margin-top:2px;">Superpowers, Context Mode, Claude Mem, UI/UX Pro Max, UI Craft, Grill Me and more.</div></div>
          </div>
          <div style="display:flex;align-items:center;gap:14px;background:#1a140f;border:1px solid #2e251d;border-radius:11px;padding:13px 16px;">
            <span style="font-size:10px;font-weight:700;letter-spacing:1px;color:#9ccc4f;background:rgba(156,204,79,.12);border:1px solid rgba(156,204,79,.3);padding:4px 9px;border-radius:6px;flex-shrink:0;">TIP</span>
            <div><div style="font-weight:700;font-size:14px;color:#ece5dd;">Click any card to copy its trigger</div><div style="font-size:13px;color:#94897f;margin-top:2px;">Then paste it straight into Claude. Use search or the pills to filter.</div></div>
          </div>
        </div>
      </div>

      <div style="margin-top:46px;display:flex;align-items:center;gap:12px;background:#211b16;border:1px solid #382e25;border-radius:14px;padding:0 18px;height:54px;max-width:760px;margin-left:auto;margin-right:auto;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8a817a" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
        <input id="search-input" type="text" value="${esc(state.search)}" oninput="onSearch(this.value)" placeholder="Search skills, commands, descriptions..." style="flex:1;background:transparent;border:none;color:#f0e9e1;font-size:15px;font-family:inherit;height:100%;">
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:20px;">${pills}</div>

      <div style="margin-top:30px;">${sections}</div>
      ${noResults ? `<div style="text-align:center;padding:70px 0;color:#8a817a;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#5b5249" stroke-width="1.5" style="margin-bottom:14px;"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
        <div style="font-family:'Newsreader',serif;font-size:22px;color:#c8c0b6;">No matches found</div>
        <div style="font-size:14px;margin-top:6px;">Try a different search term or category.</div></div>` : ""}
    </div>
    ${modal}
  </div>`;

  const si = document.getElementById("search-input");
  if (si && document.activeElement !== si && state.search) { si.focus(); si.setSelectionRange(si.value.length, si.value.length); }
}

function onSearch(v) {
  state.search = v;
  render();
  const si = document.getElementById("search-input");
  if (si) { si.focus(); si.setSelectionRange(si.value.length, si.value.length); }
}
function setActive(label) { state.active = label; render(); }
function openModal() { state.modalOpen = true; state.formError = false; render(); }
function closeModal() { state.modalOpen = false; render(); }
function copyCmd(command) {
  const done = () => { state.copied = command; render(); clearTimeout(window._ct); window._ct = setTimeout(() => { state.copied = null; render(); }, 1400); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(command).then(done).catch(() => done());
  else done();
}
function submitSkill() {
  const title = (document.getElementById("f-title").value || "").trim();
  if (!title) { state.formError = true; render(); return; }
  const type = document.getElementById("f-type").value || "command";
  let command = (document.getElementById("f-command").value || "").trim();
  if (!command) { const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); command = type === "skill" ? "skill: " + slug : "/" + slug; }
  const desc = (document.getElementById("f-desc").value || "").trim() || "Custom skill added from the dashboard.";
  const category = document.getElementById("f-category").value || ORDER[0];
  const item = { title, command, desc, category, type, project: "Custom" };
  ITEMS.push(item);
  try { const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); saved.push(item); localStorage.setItem(STORAGE_KEY, JSON.stringify(saved)); } catch (e) {}
  state.modalOpen = false; render();
}

render();
</script>
